name: M0 gameplay engine tests
on:
  push:
    paths:
      - "src/m0/**"
      - "m0.html"
      - "m0.css"
      - "tests/**"
      - "package.json"
      - "scripts/verify-m0-pages.mjs"
      - "scripts/simulate-m0.mjs"
      - ".github/workflows/m0-tests.yml"
      - "data/codex/codex.v0.5.json"
  pull_request:
    paths:
      - "src/m0/**"
      - "m0.html"
      - "m0.css"
      - "tests/**"
      - "package.json"
      - "scripts/verify-m0-pages.mjs"
      - ".github/workflows/m0-tests.yml"
      - "data/codex/codex.v0.5.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run M0 gameplay tests
        run: npm test
      - name: Simulate 30-floor progression
        run: npm run simulate:m0
      - name: Verify static Pages assets
        run: npm run build
