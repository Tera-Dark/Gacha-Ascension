name: M0.2 long-run balance sweep
on:
  push:
    paths:
      - ".github/workflows/m0-balance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sweep 1000 seeds for three gacha strategies
        run: node scripts/simulate-m0.mjs --full
