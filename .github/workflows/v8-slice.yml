name: v0.8 playable slice acceptance
on:
  push:
    paths:
      - "src/v8/**"
      - "data/v8-slice.json"
      - "data/realms-maps.v0.8.proposal.json"
      - "preview-v0.8.html"
      - "v8.css"
      - "tests/v8*.test.mjs"
      - "scripts/verify-v8.mjs"
      - "package.json"
      - ".github/workflows/v8-slice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prototype mechanics, world data, save and UI
        run: npm run check:v8
      - name: Serve preview for real browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/v8-site.log 2>&1 &
          echo $! >/tmp/v8-server.pid
          sleep 2
      - name: Verify rendered desktop and phone HTML
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --window-size=1440,900 --dump-dom http://127.0.0.1:4173/preview-v0.8.html >/tmp/v8-desktop-dom.html 2>/tmp/v8-browser.log
          grep -q 'data-view-panel="explore"' /tmp/v8-desktop-dom.html
          grep -q 'data-draw="battle"' /tmp/v8-desktop-dom.html
          grep -q 'data-draw="elixir"' /tmp/v8-desktop-dom.html
          grep -q 'id="mapName">青云山麓' /tmp/v8-desktop-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --window-size=1440,900 --screenshot=/tmp/v8-desktop.png http://127.0.0.1:4173/preview-v0.8.html >/dev/null 2>&1
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --window-size=390,844 --screenshot=/tmp/v8-phone.png http://127.0.0.1:4173/preview-v0.8.html >/dev/null 2>&1
          test -s /tmp/v8-desktop.png
          test -s /tmp/v8-phone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-preview-screenshots
          path: |
            /tmp/v8-desktop.png
            /tmp/v8-phone.png
          if-no-files-found: ignore
