name: v0.8 playable slice acceptance
on:
  push:
    paths:
      - "src/v8/**"
      - "data/v8-slice.json"
      - "data/realms-maps.v0.8.proposal.json"
      - "preview-v0.8.html"
      - "index.html"
      - "README.md"
      - "AGENTS.md"
      - "codex.html"
      - "assets/css/preview.css"
      - "tests/v8*.test.mjs"
      - "tests/v8-mobile-smoke.html"
      - "tests/v8-landscape-smoke.html"
      - "tests/v8-live-combat-smoke.html"
      - "tests/v8-logic-smoke.html"
      - "scripts/simulate-v8-combat.mjs"
      - "scripts/verify-v8.mjs"
      - "package.json"
      - ".github/workflows/v8-slice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prototype mechanics, world data, save and UI
        run: npm run check:v8
      - name: Serve preview for real browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/v8-site.log 2>&1 &
          echo $! >/tmp/v8-server.pid
          sleep 2
      - name: Verify rendered desktop and phone HTML
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --window-size=1440,900 --dump-dom http://127.0.0.1:4173/preview-v0.8.html >/tmp/v8-desktop-dom.html 2>/tmp/v8-browser.log
          grep -q 'data-view-panel="explore"' /tmp/v8-desktop-dom.html
          grep -q 'data-draw="battle"' /tmp/v8-desktop-dom.html
          grep -q 'data-draw="elixir"' /tmp/v8-desktop-dom.html
          grep -q 'id="mapName">青云山麓' /tmp/v8-desktop-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --window-size=1440,900 --screenshot=/tmp/v8-desktop.png http://127.0.0.1:4173/preview-v0.8.html >/dev/null 2>&1
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --window-size=390,844 --screenshot=/tmp/v8-phone.png http://127.0.0.1:4173/preview-v0.8.html >/dev/null 2>&1
          test -s /tmp/v8-desktop.png
          test -s /tmp/v8-phone.png
      - name: Click mobile accordions and More system drawer in Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --window-size=390,844 --dump-dom http://127.0.0.1:4173/tests/v8-mobile-smoke.html >/tmp/v8-mobile-functional.html 2>/tmp/v8-mobile-errors.log
          if ! grep -q 'data-result="PASS"' /tmp/v8-mobile-functional.html; then
            grep -o 'FAIL:[^<]*' /tmp/v8-mobile-functional.html || true
            cat /tmp/v8-mobile-errors.log
            exit 1
          fi
      - name: Verify visible HP damage before auto combat settles
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=14000 --window-size=900,700 --dump-dom http://127.0.0.1:4173/tests/v8-live-combat-smoke.html >/tmp/v8-live-combat.html 2>/tmp/v8-live-combat-errors.log
          if ! grep -q 'data-result="PASS"' /tmp/v8-live-combat.html; then
            grep -o 'FAIL:[^<]*' /tmp/v8-live-combat.html || true
            cat /tmp/v8-live-combat-errors.log
            exit 1
          fi
      - name: Verify malformed save recovery and non-overlapping combat actions
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --window-size=900,700 --dump-dom http://127.0.0.1:4173/tests/v8-logic-smoke.html >/tmp/v8-logic-smoke.html 2>/tmp/v8-logic-smoke-errors.log
          if ! grep -q 'data-result="PASS"' /tmp/v8-logic-smoke.html; then
            grep -o 'FAIL:[^<]*' /tmp/v8-logic-smoke.html || true
            cat /tmp/v8-logic-smoke-errors.log
            exit 1
          fi
      - name: Validate actual landscape touch layout and equipment drawer in Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --window-size=844,390 --dump-dom http://127.0.0.1:4173/tests/v8-landscape-smoke.html >/tmp/v8-landscape-functional.html 2>/tmp/v8-landscape-errors.log
          if ! grep -q 'data-result="PASS"' /tmp/v8-landscape-functional.html; then
            grep -o 'FAIL:[^<]*' /tmp/v8-landscape-functional.html || true
            cat /tmp/v8-landscape-errors.log
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=844,390 --screenshot=/tmp/v8-landscape.png http://127.0.0.1:4173/preview-v0.8.html >/dev/null 2>&1
          test -s /tmp/v8-landscape.png
          for SIZE in 740,360 667,375; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --window-size="$SIZE" --dump-dom http://127.0.0.1:4173/tests/v8-landscape-smoke.html >"/tmp/v8-landscape-${SIZE}.html" 2>"/tmp/v8-landscape-${SIZE}.log"
            if ! grep -q 'data-result="PASS"' "/tmp/v8-landscape-${SIZE}.html"; then
              grep -o 'FAIL:[^<]*' "/tmp/v8-landscape-${SIZE}.html" || true
              cat "/tmp/v8-landscape-${SIZE}.log"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-preview-screenshots
          path: |
            /tmp/v8-desktop.png
            /tmp/v8-phone.png
            /tmp/v8-landscape.png
          if-no-files-found: ignore
