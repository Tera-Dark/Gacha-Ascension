name: Current game logic and browser acceptance
on:
  push:
    paths:
      - "src/v8/**"
      - "data/v8-slice.json"
      - "data/realms-maps.v0.8.proposal.json"
      - "preview-v0.8.html"
      - "index.html"
      - "README.md"
      - "AGENTS.md"
      - "codex.html"
      - "assets/css/preview.css"
      - "assets/pixel/**"
      - "docs/**"
      - "tests/v8*.test.mjs"
      - "tests/v8-mobile-smoke.html"
      - "tests/v8-landscape-smoke.html"
      - "tests/v8-live-combat-smoke.html"
      - "tests/v8-logic-smoke.html"
      - "tests/v8-novice-onboarding-smoke.html"
      - "tests/v8-true-manual-combat-smoke.html"
      - "tests/v8-auto-push-realtime-smoke.html"
      - "tests/v8-bank-smoke.html"
      - "tests/v8-pixel-assets-smoke.html"
      - "tests/v8-mobile-host-smoke.html"
      - "tests/v8-return-smoke.html"
      - "tests/v8-world-presentation-smoke.html"
      - "tests/v8-management-smoke.html"
      - "scripts/simulate-v8-combat.mjs"
      - "scripts/audit-newcomer-v094.mjs"
      - "scripts/verify-v8.mjs"
      - "scripts/browser-smoke-v8.mjs"
      - "package.json"
      - ".github/workflows/v8-slice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mechanics, world data, save and UI
        run: npm run check:v8
      - name: Install browser driver using the runner's Chromium
        run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - name: Serve isolated preview for browser fixtures
        run: |
          python3 -m http.server 4180 --bind 127.0.0.1 >/tmp/v8-site.log 2>&1 &
          sleep 2
      - name: Verify all browser fixtures with real animation and settlement clocks
        run: node scripts/browser-smoke-v8.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-preview-browser-acceptance
          path: .cache/browser-v8/
          if-no-files-found: ignore
