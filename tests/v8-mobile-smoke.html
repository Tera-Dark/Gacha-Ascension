<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V8 actual mobile interactive smoke</title>
<style>body{margin:0;background:#101b18;color:#e6d5a0;font:14px sans-serif}#result{padding:12px}iframe{display:block;border:0;width:100%;height:80vh}</style></head>
<body><output id="result" data-result="PENDING">RUNNING</output>
<iframe id="app" src="../preview-v0.8.html" title="Game under interactive test"></iframe>
<script>
const result=document.getElementById("result");
const frame=document.getElementById("app");
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const verify=(ok,msg)=>{if(!ok)throw Error(msg)};
async function start(){
 try{
  const d=frame.contentDocument,w=frame.contentWindow;
  for(let i=0;i<100&&!d.querySelector("#packList [data-draw]");i++)await sleep(50);
  verify(!!d.querySelector("#packList [data-draw]"),"No real card pack rendered");
  verify(!d.getElementById("explore").open,"Combat numerical detail should be initially folded");
  verify(!!d.getElementById("analyzeBuild")&&!!d.getElementById("equipSuggestedBuild"),"Build advisor controls missing");
  verify(!!d.getElementById("nextGoalTitle")&&!!d.getElementById("goalAction"),"Next-step guidance missing");
  const unchanged=w.localStorage.getItem("gacha-ascension-v8-slice-v1");
  d.getElementById("analyzeBuild").click();await sleep(100);
  verify(d.getElementById("buildAdvice").textContent.includes("已比对"),"Owned build simulation did not render");
  verify(w.localStorage.getItem("gacha-ascension-v8-slice-v1")===unchanged,"Read-only build advice changed save data");
  d.getElementById("goalAction").click();await sleep(80);
  verify(d.querySelector('[data-view-panel="gacha"]').classList.contains("is-active"),"Goal shortcut did not navigate to packs");
  verify(!!d.querySelector('#packList [data-pack-id="technique"]'),"Recommended pack cannot be focused");
  d.querySelector('.mobile-tabs button[data-view="explore"]').click();
  const nav=d.querySelector(".mobile-tabs");
  verify(w.getComputedStyle(nav).display!=="none","Mobile dock hidden on narrow screen");
  verify(nav.querySelectorAll("button").length===5,"Mobile dock should have 5 buttons");
  verify(nav.querySelector("button").getBoundingClientRect().height>=44,"Primary touch target too small");
  d.querySelector('#explore>summary').click();await sleep(160);
  verify(d.getElementById("explore").open,"Combat detail cannot expand");
  verify(d.querySelectorAll("#detail-explore .v8-data-row").length>=14,"Combat stat breakdown was not populated");
  const text=d.getElementById("detail-explore").textContent;
  verify(text.includes("攻击")&&text.includes("气血")&&text.includes("命中"),"Missing detailed hero combat numbers");
  d.querySelector('#explore>summary').click();await sleep(130);
  verify(!d.getElementById("explore").open,"Combat detail cannot close");
  d.getElementById("moreSystems").click();
  verify(!d.getElementById("mobileSheet").hidden,"More sheet did not open");
  verify(d.getElementById("moreSystems").getAttribute("aria-expanded")==="true","More sheet accessibility state missing");
  d.querySelector('#mobileSheet button[data-view="cave"]').click();
  verify(d.getElementById("mobileSheet").hidden,"More sheet did not dismiss after navigating");
  verify(d.querySelector('[data-view-panel="cave"]').classList.contains("is-active"),"Cave page was not activated");
  d.querySelector('#cave>summary').click();await sleep(140);
  verify(d.getElementById("detail-cave").textContent.includes("洞府灵石贡献"),"Cave numerical data did not appear");
  d.querySelector('.mobile-tabs button[data-view="gacha"]').click();
  verify(d.querySelector('[data-view-panel="gacha"]').classList.contains("is-active"),"Gacha cannot open through dock");
  d.querySelector('#gacha>summary').click();await sleep(140);
  verify(d.getElementById("detail-gacha").textContent.includes("概率"),"Gacha pool probability details absent");
  const drawButton=d.querySelector('#packList button[data-draw="battle"][data-count="1"]');
  verify(!!drawButton&&!drawButton.disabled,"Fresh save cannot afford first battle draw");
  const existing=w.localStorage.getItem("gacha-ascension-v8-slice-v1");
  const before=existing?JSON.parse(existing):{seq:0}; // Fresh preview state is not stored until first transaction.
  drawButton.click();await sleep(100);
  const overlay=d.getElementById("revealOverlay");
  verify(!overlay.hidden,"Gacha reveal stage failed to open");
  const after=JSON.parse(w.localStorage.getItem("gacha-ascension-v8-slice-v1"));
  verify(after.seq===before.seq+1,"Gacha reward was not committed exactly once before animation");
  verify(after.run.cards.B001>=1,"Guaranteed first battle card was not granted");
  d.getElementById("skipReveal").click();await sleep(40);
  verify(!d.getElementById("closeReveal").hidden,"Reveal skip did not expose collect control");
  d.getElementById("closeReveal").click();await sleep(40);
  verify(overlay.hidden,"Gacha reveal did not close");
  const preserved=JSON.parse(w.localStorage.getItem("gacha-ascension-v8-slice-v1"));
  verify(preserved.seq===after.seq,"Skipping the gacha animation duplicated the draw");
  verify(d.documentElement.scrollWidth<=w.innerWidth+1,"Horizontal page overflow on mobile: "+d.documentElement.scrollWidth+" > "+w.innerWidth);
  result.dataset.result="PASS";result.textContent="PASS: mobile nav, foldable stats, card probability, safe gacha reveal, cave and responsive touch layout";
 }catch(err){
  result.dataset.result="FAIL";result.textContent="FAIL: "+err.message;
 }
}
frame.addEventListener("load",start);
</script></body></html>
