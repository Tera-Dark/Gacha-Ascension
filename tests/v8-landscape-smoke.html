<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v8 landscape workstation browser acceptance</title>
<style>html,body{margin:0;background:#162522;color:#f2d89f;font:12px system-ui}#result{padding:3px}iframe{display:block;border:0;width:100vw;height:calc(100dvh - 22px)}</style></head><body>
<output id="result" data-result="PENDING">RUNNING LANDSCAPE ACCEPTANCE</output>
<iframe id="app" src="../preview-v0.8.html" title="Landscape battle workstation"></iframe>
<script>
const output=document.getElementById("result"),frame=document.getElementById("app");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const check=(v,message)=>{if(!v)throw Error(message)};
frame.addEventListener("load",async()=>{
 try{
  const d=frame.contentDocument,w=frame.contentWindow;
  for(let n=0;n<100&&d.querySelectorAll(".wb-gear-slot").length<10;n++)await sleep(60);
  check(d.querySelectorAll(".wb-gear-slot").length===10,"10 equipment slots missing");
  check(d.querySelectorAll(".wb-artifact-slot").length===4,"Four major-realm artifacts missing");
  check([...d.querySelectorAll(".wb-artifact-slot")].every(x=>x.disabled),"Artifact slots must remain locked before 筑基");
  check(d.querySelectorAll('[data-view="items"]').length>=1,"Items inventory navigation absent");
  check(d.querySelectorAll(".battle-workbench>.wb-pane").length===2,"player/enemy station missing");
  const nav=d.getElementById("landscapeNavToggle");
  check(w.getComputedStyle(nav).display!=="none","landscape navigation toggle invisible");
  const panes=[...d.querySelectorAll(".battle-workbench>.wb-pane")];
  check(panes.every(x=>x.getBoundingClientRect().width>170),"combat panel too narrow");
  check(Math.abs(panes[0].getBoundingClientRect().top-panes[1].getBoundingClientRect().top)<2,"player/enemy panels not horizontal");
  // New players see the three-step guide instead of ten inert slots.
  check(!d.getElementById("noviceGuide").hidden,"first-life guide was not offered");
  d.getElementById("noviceSkip").click();await sleep(60);
  check(d.getElementById("noviceGuide").hidden,"novice guide skip did not work");
  check(d.querySelector(".wb-gear-slot").getBoundingClientRect().height>=44,"equipment touch target smaller than 44px");
  d.querySelector('[data-gear-slot="weapon1"]').click();await sleep(35);
  check(!d.getElementById("equipmentDrawer").hidden,"equipment modal not displayed");
  check(d.getElementById("equipmentChoices").querySelectorAll("button").length>=2,"equipment inventory choices absent");
  d.getElementById("closeEquipment").click();check(d.getElementById("equipmentDrawer").hidden,"cannot close inventory");
  nav.click();await sleep(70);
  check(d.body.classList.contains("wb-nav-open"),"landscape side drawer not open");
  check(!d.getElementById("landscapeBackdrop").hidden,"drawer backdrop hidden");
  check(d.getElementById("mapDrawerList").querySelectorAll("button").length===4,"map list not populated");
  check(d.getElementById("drawerCheckpointTrack").querySelectorAll("button").length===8,"stage list not populated");
  d.getElementById("landscapeBackdrop").click();
  check(!d.body.classList.contains("wb-nav-open"),"side drawer failed to close");
  d.querySelector('.system-sidebar [data-view="items"]').click();await sleep(80);
  check(d.querySelector('[data-view-panel="items"]').classList.contains("is-active"),"Items panel cannot open");
  check(d.getElementById("boxInventory").querySelectorAll('[data-open-box]').length===2,"Box options missing");
  check(d.getElementById("herbInventory").querySelectorAll('[data-brew]').length===3,"Herbs/crafting options missing");
  check(d.getElementById("consumableInventory").querySelectorAll('[data-prepare-item]').length===3,"Combat medicine slots missing");
  check(d.getElementById("unlockAutoPotion").disabled,"Auto potion must be gated behind reincarnation points");
  d.querySelector('.system-sidebar [data-view="explore"]').click();await sleep(70);
  check(d.getElementById("enemySprite").textContent.trim().length>0,"no monster representation");
  check(d.getElementById("heroAttackBar").style.animationDuration.endsWith("ms"),"hero interval not tied to engine");
  check(d.getElementById("enemyAttackBar").style.animationDuration.endsWith("ms"),"enemy interval not tied to engine");
  check(d.documentElement.scrollWidth<=w.innerWidth+2,"landscape horizontal overflow "+d.documentElement.scrollWidth+"/"+w.innerWidth);
  output.dataset.result="PASS";output.textContent="PASS: 10 slots, landscape dual panes, interactive map drawer, inventory, attack bars, no x-overflow";
 }catch(error){output.dataset.result="FAIL";output.textContent="FAIL: "+error.message}
});
</script></body></html>
