<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V8 audit smoke: invalid save and overlapping battle guard</title>
<style>body{background:#102420;color:#f8dfb6;font:14px sans-serif;margin:0}output{padding:10px;display:block}iframe{width:100%;height:70vh;border:0}</style></head>
<body><output id="result" data-result="PENDING">RUNNING</output><iframe id="game" title="Game under audit test"></iframe>
<script type="module">
import {SCHEMA,SAVE_KEY} from '../src/v8/engine.mjs';
const KEY=SAVE_KEY;
const output=document.getElementById("result"),frame=document.getElementById("game");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const check=(yes,msg)=>{if(!yes)throw Error(msg)};
if(location.port!=='4180'){output.dataset.result='SKIP';output.textContent='SKIP: isolated port 4180 required'}else{
let loads=0;
localStorage.setItem(KEY,'{"invalid":true');
frame.addEventListener("load",async()=>{
 try{
  loads++;
  const d=frame.contentDocument,w=frame.contentWindow;
  if(loads===1){
   for(let i=0;i<40&&!d.getElementById("invalidSaveRecovery");i++)await sleep(30);
   check(!!d.getElementById("invalidSaveRecovery"),"invalid save does not show recovery controls");
   check(!!d.getElementById("exportInvalidSave"),"invalid save cannot be exported");
   check(localStorage.getItem(KEY)==='{"invalid":true',"invalid save was overwritten automatically");
   w.confirm=()=>true;
   d.getElementById("recoverInvalidSave").click();
   return;
  }
  for(let i=0;i<90&&!d.querySelector('#packList [data-draw="battle"]');i++)await sleep(40);
  check(!!d.querySelector('#packList [data-draw="battle"]'),"recovered app did not initialize");
  const s=JSON.parse(localStorage.getItem(KEY));
  check(s.schemaVersion===SCHEMA,"recovered save is not the current schema");
  const backups=Object.keys(localStorage).filter(k=>k.startsWith(KEY+"-invalid-recovery"));
  check(backups.some(k=>localStorage.getItem(k)==='{"invalid":true'),"invalid source bytes not preserved");
  d.getElementById("killMob").click();
  await sleep(70);
  const after=JSON.parse(localStorage.getItem(KEY));
  check(after.seq>s.seq,"manual fight failed to transact");
  d.getElementById("autoFarm").click();
  await sleep(50);
  const blocked=JSON.parse(localStorage.getItem(KEY));
  check(blocked.seq===after.seq,"started auto mode while manual replay was active");
  check(!blocked.run.idle?.active,"idle mode overlapped manual combat");
  output.dataset.result="PASS";
  output.textContent="PASS: invalid save remains intact, can be recovered with backup; manual and auto fights cannot overlap";
 }catch(e){output.dataset.result="FAIL";output.textContent="FAIL: "+e.message}
});
frame.src="../preview-v0.8.html";
}
</script></body></html>
