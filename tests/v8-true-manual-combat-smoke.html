<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realtime manual and multiwave combat acceptance</title><style>html,body{margin:0;background:#132622;color:#f1d5a1;font:12px sans-serif}output{padding:5px;display:block}iframe{width:100vw;height:calc(100dvh - 24px);border:0}</style></head><body><output data-result="PENDING" id="result">RUNNING REAL-TIME COMBAT</output><iframe src="../preview-v0.8.html" id="game" title="Live game"></iframe>
<script type="module">
import {fight,loadCatalog} from "../src/v8/engine.mjs";
const frame=document.getElementById("game"),out=document.getElementById("result");
const delay=t=>new Promise(r=>setTimeout(r,t)),check=(ok,m)=>{if(!ok)throw Error(m)};
const key="gacha-ascension-v8-slice-v1";
const c=loadCatalog(await(await fetch("../data/realms-maps.v0.8.proposal.json")).json(),await(await fetch("../data/v8-slice.json")).json());
let phase=0,guardian=null;
frame.addEventListener("load",async()=>{
 try{
  const d=frame.contentDocument,w=frame.contentWindow,read=()=>JSON.parse(w.localStorage.getItem(key));
  for(let i=0;i<100&&!d.querySelector('#packList [data-draw="battle"]');i++)await delay(30);
  check(!!d.querySelector('#packList [data-draw="battle"]'),"UI did not initialize");
  if(phase===0){
   out.dataset.phase="manual-start";out.textContent="Phase: initial manual battle";
   d.getElementById("killMob").click();await delay(70);
   const pending=read();
   check(!!pending?.run.pendingBattle,"manual small mob must PREPARE, not finish instantly");
   check(!pending.run.lastBattle,"manual mob received instant rewards before any hit");
   const predicted=fight(pending,c,"mob",{seed:pending.run.pendingBattle.seed});
   const hit=predicted.logs.find(x=>x.actor==="hero"&&x.amount>0&&x.timeMs<predicted.timeMs-200);
   check(!!hit,"no intermediate damaging strike for real-time validation");
   check(d.getElementById("enemyHP").textContent!==hit.hp+" / "+hit.max,"damage shown before timed strike");
   out.dataset.phase="await-first-hit";out.textContent="Phase: waiting for manual first hit at "+hit.timeMs;
   await delay(hit.timeMs+160);
   check(d.getElementById("enemyHP").textContent===hit.hp+" / "+hit.max,
    "manual HP failed to change on strike: "+d.getElementById("enemyHP").textContent+" vs "+hit.hp+" / "+hit.max);
   check(!!read().run.pendingBattle&&read().run.lastBattle===null,"save settled before elapsed fight time");
   out.dataset.phase="await-first-finish";out.textContent="Phase: waiting for mob finish "+predicted.timeMs;
   await delay(Math.max(0,predicted.timeMs-hit.timeMs)+240);
   check(!read().run.pendingBattle&&!!read().run.lastBattle,"manual fight did not finish at real clock");
   check(d.getElementById("enemyHP").textContent.startsWith(predicted.enemyRemaining+" /"),"final HP diverges from actual outcome");
   d.getElementById("challenge").click();await delay(110);
   const prepared=read();guardian={start:prepared.run.pendingBattle?.startedAt,combat:fight(prepared,c,"guardian",{seed:prepared.seed})};
   check(!!guardian.start&&prepared.run.checkpoint===0,"guardian progressed immediately on clicking");
   check(guardian.combat.waves.length===2,"guardian must have two timed waves");
   check(prepared.run.lastBattle.type==="mob","guardian must not overwrite battle receipt before hit");
   phase=1;out.dataset.phase="guardian-reload";out.textContent="Phase: reloading guardian "+guardian.combat.timeMs;
   w.location.reload();
   return;
  }
  out.dataset.phase="guardian-resumed";out.textContent="Phase: guardian reloaded";
  const pending=read();
  check(pending.run.pendingBattle?.kind==="guardian","refresh lost running multiwave guardian battle");
  const elapsed=Date.now()-guardian.start;
  check(elapsed<guardian.combat.timeMs,"guardian unexpectedly ended before resume check");
  check(pending.run.checkpoint===0,"guardian advanced without completing both waves");
  const pendingUntil=guardian.start+guardian.combat.timeMs;
  out.dataset.phase="guardian-final";out.textContent="Phase: waiting for guardian end; remaining="+(pendingUntil-Date.now());
  await delay(Math.max(0,pendingUntil-Date.now())+300);
  const done=read();
  check(!done.run.pendingBattle,"reloaded battle was not committed");
  check(done.run.lastBattle?.type==="guardian","reloaded battle never produced guardian receipt");
  check(done.run.checkpoint===(guardian.combat.won?1:0),"guardian outcome differs after reload");
  check(done.run.lastBattle.won===guardian.combat.won,"reloaded battle RNG differs");
  check(d.getElementById("combatStatus").textContent.includes(guardian.combat.won?"胜利":"失败")||
    d.getElementById("combatStatus").textContent.includes("僵持"),"battle did not display final result");
  out.dataset.result="PASS";out.textContent="PASS: manual HP changes before rewards, multi-wave guardian survives reload without early progression or duplicated payout";
 }catch(e){out.dataset.result="FAIL";out.textContent="FAIL: "+e.message}
});
</script></body></html>
